#   3  类目同义词映射的落点
#
# 业务词只住在这里和 blogger_docs.md，不进 src/（ADR 0002）。
#
# 每一栏的意思：
#   原话       用户会怎么说这句（可以有口语、指代、省略）
#   当前问题   主 Agent 该把它收成的那一句（可独立理解、能单独拿去查）
#   答案类型   实体集（一群人）| 标量（一个数）| 分组标量（多个数各带一个维度值）
#   金标SQL    你认为对的那条 SQL。基数、锚点都由它推出来
#   基数       金标SQL 的命中总数。第一次跑由脚本回填；之后每次跑都拿它和库对，
#              对不上就报「金标过期」——库变了或 SQL 变了，先解决这个再谈别的
#   必含/必不含 ≤5 个 xhs_id，人工从数据里挑。抓的是基数看不出的错：
#              粉丝恰好 50000 的必须在内、50001 的必须不在外
#   期望分支   有行 | 0行 | 失败
#   条件清单   可选。只在基数对不上时补，用来做归因（脚本按子集组合生成变体，报出丢了哪个条件）
#   必须提示   回填材料里必须出现的字符串。比如「采样说明」，对应「命中 N 条，回填 M 条」
#   备注       可选，写清这条为什么这么问

